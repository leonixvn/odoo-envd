[project]
name = "odoo-envd"
version = "0.1.0"
description = "CD engine for Odoo branch-to-database environments: git worktrees + native odoo CLI + docker compose, with a REST API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
envd = "envd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envd"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["envd", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "B008",   # FastAPI idiom: Depends(...) calls in argument defaults
    "SIM108", # ternary is not always clearer
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
