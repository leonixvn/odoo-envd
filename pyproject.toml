[project]
name = "odoo-envd"
version = "0.2.0"
description = "Local Odoo and PostgreSQL sandbox manager"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
envd = "envd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envd"]
